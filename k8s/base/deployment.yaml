apiVersion: apps/v1
kind: Deployment
metadata:
  # Platform convention: the contract's `app` service is named
  # `<organizacion>-app`. The generated NetworkPolicy selects by the
  # label `app: conf-hub` and the derived IngressRoute looks for the
  # Service `conf-hub` on 8080 — these names are NOT free.
  name: conf-hub
  labels: {app: conf-hub}
spec:
  replicas: 1
  # With 1 replica the default rolling update (maxUnavailable 25% → 1)
  # leaves ~30s of Bad Gateway on every update. Surge first, kill after
  # = zero window; the transient extra pod fits in the `pequena` quota.
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: conf-hub}
  template:
    metadata:
      labels: {app: conf-hub}
    spec:
      # The pull secret comes from the namespace's default SA: the app
      # does NOT declare the registry credential.
      # PSS: the namespace is enforce=restricted — the workload DECLARES
      # the whole profile (explicit > magic). The image already runs as
      # USER 65532 (Containerfile) → runAsNonRoot validates with no
      # runAsUser here.
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      # longer than the preStop sleep above plus the app's own shutdown
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          # The IMAGE is governed by the overlay (kustomize images) and
          # the pipeline writes the DIGEST into it on every build. This
          # reference is only the base the overlay rewrites.
          image: registry.registry-system.svc.cluster.local:5000/conf-hub
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # A container that cannot write its own image cannot be
            # persistently modified by whoever gets inside it: the next
            # restart is the original bytes again. PSS restricted does
            # not demand it, the platform does — and it is free here
            # because a static Go binary writes nothing. Whatever needs
            # to write mounts an emptyDir on /tmp (see the
            # `service-node` and `service-java` templates, which do).
            readOnlyRootFilesystem: true
          # Las variables vienen del contrato de plataforma (25-09): redis es
          # el servicio `bus` con su Secret; el login del panel, `hub-panel`.
          # La clave de firma se deriva de la contraseña de redis (main.go).
          env:
            - {name: REDIS_ADDR, value: "bus:6379"}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: bus-credenciales, key: password}}
            - name: OPERADOR_USUARIO
              valueFrom: {secretKeyRef: {name: hub-panel, key: usuario}}
            - name: OPERADOR_PASSWORD
              valueFrom: {secretKeyRef: {name: hub-panel, key: password}}
            - {name: SALAS_DEMO, value: "2"}
            - {name: DEMO_SOLO_CON_PUBLICO, value: "1"}
            - {name: PARCIAL_CADA_S, value: "3"}
            - {name: BACKEND_DEFECTO, value: "gpu"}
            - {name: MAX_SALAS, value: "28"}
            # Detrás del túnel de Cloudflare: la IP del visitante (para el
            # tope por visitante) viene en CF-Connecting-IP.
            - {name: CONFIAR_CF, value: "1"}
            - {name: COOKIE_SEGURA, value: "1"}
            # Mientras la ruta tenga el middleware `buffering` (hallazgo A-01,
            # pedido D-07): cada respuesta SSE se cierra a los 1,5 s para que
            # el proxy la suelte, y el navegador reconecta con Last-Event-ID.
            # Cuando plataforma saque el buffering de esa ruta: poner "0".
            - {name: SSE_VENTANA_S, value: "1.5"}
          # La del PROCESO. /api/healthz (motor incluido) es la del sitio,
          # no la del pod: un Recreate del motor no puede matar al hub.
          readinessProbe:
            httpGet: {path: /api/listo, port: 8080}
          livenessProbe:
            httpGet: {path: /api/listo, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
          # A RELEASE MUST NOT DROP THE PEOPLE ON THE SITE (plan/19 B-8).
          # On SIGTERM the pod leaves the Service's endpoints and stops at
          # the same instant, but traefik keeps routing to it until the
          # endpoints change reaches it: measured 2026-09-24, every rollout
          # under 300 req/s dropped ~296 requests in 3 s (502s and 10 s
          # hangs), on the cloud instance and on Debian alike. Five seconds
          # of sleep before the signal covers that propagation. The native
          # `sleep` action needs no shell (the runtime images carry none).
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          # Tamaño `grande`: sostiene las conexiones SSE de la audiencia y
          # embebe el audio demo (~8 MB) y el front.
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: conf-hub
spec:
  selector: {app: conf-hub}
  # The platform ALWAYS routes to port 8080 of the Service (convention
  # of the derived IngressRoute): this port is not changed here, it is
  # changed in the contract… and today the contract does not change it
  # either.
  ports: [{port: 8080, targetPort: 8080}]
